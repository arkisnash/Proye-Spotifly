<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotifly</title>
  <link rel="stylesheet" href="./src/css/app.css">
</head>

<body x-data class="min-h-screen">

  <div class="min-h-screen">

    <aside
      x-show="$store.sesion.estaAutenticado"
      class="p-4 border-b border-slate-500/20"
      style="background: var(--color-superficie)"
    >

      <a href="#/inicio" class="flex items-center gap-2 font-bold text-lg">
        <img src="/logo.png" alt="Logo" class="w-8 h-8">
        Spotifly
      </a>

      <nav class="flex flex-wrap gap-4 mt-4 text-sm">

        <a href="#/inicio">Inicio</a>
        <a href="#/explorar">Explorar</a>
        <a href="#/biblioteca">Biblioteca</a>
        <a href="#/perfil">Perfil</a>
        <a href="#/configuracion">Configuración</a>

        <a
          x-show="$store.sesion.esAdmin"
          href="#/admin"
        >Admin</a>

      </nav>

      <div class="flex gap-3 mt-4">

        <button @click="$store.tema.alternar()">
          Tema:
          <span x-text="$store.tema.oscuro ? 'Oscuro' : 'Claro'"></span>
        </button>

        <button
          @click="$store.sesion.cerrar()"
          class="text-red-500"
        >
          Cerrar sesión
        </button>

      </div>
    </aside>

    <main
      id="vista-actual"
      class="p-6"
      x-html="$store.router.html"
    ></main>

  </div>

  <script type="module" src="./src/main.js"></script>

</body>
</html>
<!-- [IA] fin -->
