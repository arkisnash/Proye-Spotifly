<section x-data="vistaRegistro" class="animate-aparecer mx-auto max-w-md py-8 lg:py-12">

  <h1 class="titulo-pagina">Crear cuenta</h1>

  <form class="tarjeta mt-6 space-y-4 p-6"
        novalidate
        @submit.prevent="enviar()"
        @input="revalidar($event)">

    <div>
      <label class="etiqueta">Nombre</label>
      <input name="nombre" class="entrada"
             x-model.trim="form.nombre"
             @input="validarCampo('nombre')">
      <p class="error-campo" x-show="errores.nombre" x-text="errores.nombre"></p>
    </div>

    <div>
      <label class="etiqueta">Nombre de usuario</label>
      <input name="usuario" class="entrada"
             x-model.trim="form.usuario"
             @input="validarCampo('usuario')">
      <p class="error-campo" x-show="errores.usuario" x-text="errores.usuario"></p>
    </div>

    <div>
      <label class="etiqueta">Correo electrónico</label>
      <input name="email" type="email" class="entrada"
             x-model.trim="form.email"
             @input="validarCampo('email')">
      <p class="error-campo" x-show="errores.email" x-text="errores.email"></p>
    </div>

    <div>
      <label class="etiqueta">Contraseña</label>
      <input name="password" type="password" class="entrada"
             x-model="form.password"
             @input="validarCampo('password')">
      <p class="error-campo" x-show="errores.password" x-text="errores.password"></p>
    </div>

    <div>
      <label class="etiqueta">Repetir contraseña</label>
      <input name="confirmar" type="password" class="entrada"
             x-model="form.confirmar"
             @input="validarCampo('confirmar')">
      <p class="error-campo" x-show="errores.confirmar" x-text="errores.confirmar"></p>
    </div>

    <p class="alerta-error" x-show="errorGeneral" x-text="errorGeneral"></p>

    <button type="submit" class="btn btn-primario w-full"
            :disabled="enviando">
      <span x-text="enviando ? 'Creando cuenta...' : 'Crear cuenta'"></span>
    </button>

    <p class="text-center text-sm text-tenue">
      ¿Ya tienes cuenta?
      <a href="#/login" class="text-acento">Inicia sesión</a>
    </p>

  </form>
</section>
<!--[IA] fin-->
