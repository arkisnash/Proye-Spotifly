<section class="p-6 max-w-4xl mx-auto" x-data="{
  playlist: null,
  catalogo: [],
  cancionSeleccionada: '',
  editando: false,
  nombreEdit: '',
  descEdit: '',
  cargando: true,
  error: '',

  async init() {
    const id = window.location.hash.split('/')[2];
    const [rPl, rCan] = await Promise.all([
      this.$api.playlists.obtener(id),
      this.$api.canciones.listar()
    ]);
    if (rPl.ok) {
      this.playlist = rPl.data;
      this.nombreEdit = rPl.data.nombre;
      this.descEdit = rPl.data.descripcion;
    } else {
      this.error = rPl.error || 'No se encontró la playlist.';
    }
    if (rCan.ok) this.catalogo = rCan.data;
    this.cargando = false;
  },

  get cancionesEnPlaylist() {
    if (!this.playlist) return [];
    return (this.playlist.cancionIds || [])
      .map((id) => this.catalogo.find((c) => c.id == id))
      .filter(Boolean);
  },

  get cancionesDisponibles() {
    if (!this.playlist) return [];
    const actuales = this.playlist.cancionIds || [];
    return this.catalogo.filter((c) => !actuales.includes(c.id));
  },

  async guardarDatos() {
    if (!this.nombreEdit.trim()) return;
    const res = await this.$api.playlists.actualizar(this.playlist.id, {
      nombre: this.nombreEdit.trim(),
      descripcion: this.descEdit.trim()
    });
    if (res.ok) {
      this.playlist = res.data;
      this.editando = false;
      $store.toast.mostrar('Playlist actualizada');
    }
  },

  async agregarCancion() {
    const id = Number(this.cancionSeleccionada);
    if (!id || !this.playlist) return;
    const nuevosIds = [...(this.playlist.cancionIds || []), id];
    const res = await this.$api.playlists.actualizar(this.playlist.id, { cancionIds: nuevosIds });
    if (res.ok) {
      this.playlist.cancionIds = nuevosIds;
      this.cancionSeleccionada = '';
      $store.toast.mostrar('Canción agregada a la playlist');
    }
  },

  async quitarCancion(cancionId) {
    const nuevosIds = (this.playlist.cancionIds || []).filter((id) => id != cancionId);
    const res = await this.$api.playlists.actualizar(this.playlist.id, { cancionIds: nuevosIds });
    if (res.ok) {
      this.playlist.cancionIds = nuevosIds;
      $store.toast.mostrar('Canción quitada de la playlist');
    }
  },

  formatoDuracion(seg) {
    if (!seg) return '0:00';
    return Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0');
  }
}">

  <a href="#/biblioteca" class="text-sm text-acento hover:underline">&larr; Volver a Biblioteca</a>

  <p x-show="cargando" class="mt-4 text-texto-2">Cargando playlist...</p>
  <p x-show="error" class="mt-4 text-red-400" x-text="error"></p>

  <div x-show="!cargando && playlist" class="mt-4">
    <!-- Encabezado de la Playlist -->
    <div class="rounded-2xl border border-borde bg-superficie p-6">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="flex-1 min-w-[240px]">
          <p class="text-xs uppercase tracking-wider text-texto-2">Playlist</p>

          <div x-show="!editando">
            <h1 class="mt-1 text-2xl font-bold text-acento" x-text="playlist?.nombre"></h1>
            <p class="mt-1 text-sm text-texto-2" x-text="playlist?.descripcion"></p>
            <p class="mt-2 text-xs text-texto-2" x-text="cancionesEnPlaylist.length + ' canciones'"></p>
          </div>

          <!-- Edición de nombre y descripción -->
          <form x-show="editando" @submit.prevent="guardarDatos()" class="mt-2 space-y-2">
            <input type="text" x-model="nombreEdit" required class="w-full rounded-lg border border-campo bg-fondo px-3 py-1.5 text-sm" />
            <input type="text" x-model="descEdit" class="w-full rounded-lg border border-campo bg-fondo px-3 py-1.5 text-sm" />
            <div class="flex gap-2">
              <button type="submit" class="rounded-lg bg-boton px-3 py-1 text-xs font-semibold text-white cursor-pointer">Guardar</button>
              <button type="button" @click="editando = false" class="rounded-lg border border-borde px-3 py-1 text-xs cursor-pointer">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="flex items-center gap-2">
          <button type="button" x-show="!editando" @click="editando = true"
            class="rounded-full border border-borde bg-fondo px-4 py-2 text-xs font-medium text-texto hover:border-acento cursor-pointer">
            Editar datos
          </button>
          <button x-show="cancionesEnPlaylist.length > 0" type="button"
            @click="$store.reproductor.reproducir(cancionesEnPlaylist[0])"
            class="rounded-full bg-boton px-5 py-2 text-sm font-semibold text-white hover:opacity-90 cursor-pointer">
            ▶ Reproducir
          </button>
        </div>
      </div>

      <!-- Selector rápido para agregar canciones del catálogo -->
      <div class="mt-6 flex flex-wrap items-center gap-3 border-t border-borde pt-4">
        <select x-model="cancionSeleccionada" class="flex-1 min-w-[220px] rounded-lg border border-campo bg-fondo px-3 py-2 text-sm">
          <option value="">Selecciona una canción del catálogo para agregar...</option>
          <template x-for="c in cancionesDisponibles" :key="c.id">
            <option :value="c.id" x-text="c.titulo + ' — ' + c.artista"></option>
          </template>
        </select>
        <button type="button" @click="agregarCancion()" :disabled="!cancionSeleccionada"
          class="rounded-lg bg-boton px-4 py-2 text-sm font-medium text-white disabled:opacity-40 cursor-pointer">
          + Agregar a la playlist
        </button>
      </div>
    </div>

    <!-- Lista de pistas estilo YouTube Music -->
    <p x-show="cancionesEnPlaylist.length === 0" class="mt-6 text-sm text-texto-2">
      Esta playlist aún no tiene canciones. Agrégalas con el selector de arriba o desde el botón (⋮) en Inicio y Explorar.
    </p>

    <ul class="mt-4 space-y-2">
      <template x-for="c in cancionesEnPlaylist" :key="c.id">
        <li class="flex items-center justify-between gap-3 rounded-xl border border-borde bg-superficie p-3 hover:border-acento/50 transition">
          <div class="flex items-center gap-3.5 min-w-0 flex-1">
            <button type="button" @click="$store.reproductor.reproducir(c)"
              class="size-11 shrink-0 rounded-lg bg-fondo border border-borde flex items-center justify-center text-white hover:bg-boton transition cursor-pointer"
              :class="$store.reproductor.actual?.id === c.id && 'border-acento bg-boton/20'">
              <span x-text="$store.reproductor.actual?.id === c.id && $store.reproductor.sonando ? '⏸' : '▶'"></span>
            </button>
            <div class="min-w-0 flex-1">
              <a :href="'#/cancion/' + c.id" class="block font-semibold text-texto hover:text-acento truncate" x-text="c.titulo"></a>
              <p class="text-xs text-texto-2 truncate" x-text="c.artista"></p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <span class="text-xs text-texto-2" x-text="formatoDuracion(c.duracion)"></span>
            <button type="button" @click="quitarCancion(c.id)"
              class="rounded-lg border border-red-500/40 px-2.5 py-1 text-xs text-red-400 hover:bg-red-500/10 cursor-pointer">
              Quitar
            </button>
          </div>
        </li>
      </template>
    </ul>
  </div>
</section>
<!-- [IA] fin -->
