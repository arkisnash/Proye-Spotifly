<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de canciones</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-white">

<section class="mx-auto max-w-3xl p-6"
  x-data="{
    canciones: [
      { id: 1, titulo: 'Órbita lenta',    artista: 'Noa Vale',   genero: 'Ambient',    duracion: 214 },
      { id: 2, titulo: 'Ciudad ámbar',    artista: 'Luz Marina', genero: 'Synth pop',  duracion: 187 },
      { id: 3, titulo: 'Mareas de papel', artista: 'Elio Sur',   genero: 'Lo-fi',      duracion: 163 },
      { id: 4, titulo: 'Neón y lluvia',   artista: 'Luz Marina', genero: 'Synth pop',  duracion: 245 },
      { id: 5, titulo: 'Cuerdas al alba', artista: 'Elio Sur',   genero: 'Acústico',   duracion: 198 },
      { id: 6, titulo: 'Bruma',           artista: 'Noa Vale',   genero: 'Ambient',    duracion: 301 },
    ],
    busqueda: '',
    genero: '',
    orden: 'titulo-asc',

    get generos() {
      return [...new Set(this.canciones.map((c) => c.genero))].sort();
    },

    get resultado() {
      const q = this.busqueda.trim().toLowerCase();
      const lista = this.canciones.filter((c) =>
        (!q || c.titulo.toLowerCase().includes(q)) &&
        (!this.genero || c.genero === this.genero));

      const [campo, dir] = this.orden.split('-');
      return lista.sort((a, b) => {
        const r = typeof a[campo] === 'number'
          ? a[campo] - b[campo]
          : a[campo].localeCompare(b[campo]);
        return dir === 'desc' ? -r : r;
      });
    },

    formatoDuracion(seg) {
      return Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0');
    },
  }">

  <h1 class="text-2xl font-bold text-violet-400">Catálogo</h1>

  <!-- Controles: cada uno actúa por separado -->
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <input type="search" x-model="busqueda" placeholder="Buscar por nombre"
      class="rounded-lg border border-violet-700 bg-gray-900 px-4 py-2" />

    <select x-model="genero" class="rounded-lg border border-violet-700 bg-gray-900 px-4 py-2">
      <option value="">Todos los géneros</option>
      <template x-for="g in generos" :key="g">
        <option :value="g" x-text="g"></option>
      </template>
    </select>

    <select x-model="orden" class="rounded-lg border border-violet-700 bg-gray-900 px-4 py-2">
      <option value="titulo-asc">Título (A-Z)</option>
      <option value="titulo-desc">Título (Z-A)</option>
      <option value="artista-asc">Artista (A-Z)</option>
      <option value="duracion-asc">Duración (menor a mayor)</option>
      <option value="duracion-desc">Duración (mayor a menor)</option>
    </select>
  </div>

  <p class="mt-4 text-sm text-gray-400" x-text="resultado.length + ' canciones'"></p>

  <!-- Vacío -->
  <p x-show="resultado.length === 0" class="mt-6 text-gray-400">No hay canciones con esos filtros.</p>

  <!-- Lista -->
  <ul class="mt-4 space-y-2">
    <template x-for="c in resultado" :key="c.id">
      <li class="flex items-center justify-between rounded-xl border border-violet-900 bg-gray-900 p-4">
        <div>
          <p class="font-semibold" x-text="c.titulo"></p>
          <p class="text-sm text-gray-400" x-text="c.artista + ' · ' + c.genero"></p>
        </div>
        <span class="text-sm text-gray-400" x-text="formatoDuracion(c.duracion)"></span>
      </li>
    </template>
  </ul>
</section>

</body>
</html>
<!-- [IA] fin -->
