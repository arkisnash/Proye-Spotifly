<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotifly</title>
    <link rel="stylesheet" href="./src/css/app.css" />
    <link rel="stylesheet" href="./src/css/404.css" />
    <link rel="stylesheet" href="./src/css/login.css" />
    <link rel="stylesheet" href="./src/css/registro.css" />
  </head>
  <body x-data class="min-h-screen flex flex-col">
    <div class="flex-1 grid grid-cols-1 md:grid-cols-[220px_1fr]">
      <aside
        x-show="$store.sesion.estaAutenticado"
        class="p-4 border-r border-slate-500/20 flex flex-col gap-4"
        style="background: var(--color-superficie)"
      >
        <a href="#/" class="flex items-center gap-2 font-bold text-lg">
          <img src="/logo.png" alt="Logo de Beat Sound Track" class="w-8 h-8 object-contain" />
          <span>Spotifly</span>
        </a>

        <nav class="flex flex-col gap-2 text-sm">
          <a href="#/" :class="$store.ruta.actual === '/' && 'font-bold text-indigo-400'">Inicio</a>
          <a href="#/explorar" :class="$store.ruta.actual === '/explorar' && 'font-bold text-indigo-400'">Explorar</a>
          <a href="#/biblioteca" :class="$store.ruta.actual === '/biblioteca' && 'font-bold text-indigo-400'">Biblioteca</a>
          <a href="#/perfil" :class="$store.ruta.actual === '/perfil' && 'font-bold text-indigo-400'">Perfil</a>
          <a href="#/configuracion" :class="$store.ruta.actual === '/configuracion' && 'font-bold text-indigo-400'">Configuración</a>
          <a
            x-show="$store.sesion.esAdmin"
            href="#/admin"
            :class="$store.ruta.actual === '/admin' && 'font-bold text-indigo-400'"
          >Admin</a>
        </nav>

        <div class="mt-auto pt-4 border-t border-slate-500/20 flex flex-col gap-2 text-xs">
          <button
            @click="$store.tema.alternar()"
            class="px-3 py-1.5 rounded border border-slate-500/30 text-left"
          >
            Tema: <span x-text="$store.tema.oscuro ? 'oscuro' : 'claro'"></span>
          </button>
          <button
            x-show="$store.sesion.estaAutenticado"
            @click="$store.sesion.cerrar(); location.hash = '#/login'"
            class="px-3 py-1.5 rounded border border-slate-500/30 text-left text-rose-400"
          >
            Cerrar sesión
          </button>
        </div>
      </aside>

      <main id="vista-actual" class="p-6" x-html="$store.ruta.html"></main>
    </div>

    <footer
      x-show="$store.sesion.estaAutenticado && $store.reproductor.actual"
      class="sticky bottom-0 p-3 border-t border-slate-500/20 flex items-center justify-between gap-4 text-sm"
      style="background: var(--color-superficie)"
    >
      <div>
        <p class="font-semibold" x-text="$store.reproductor.actual?.titulo"></p>
        <p class="text-xs opacity-70" x-text="$store.reproductor.actual?.artista"></p>
      </div>
      <div class="flex items-center gap-3">
        <button
          @click="$store.reproductor.alternar()"
          class="px-4 py-1.5 rounded bg-indigo-600 text-white text-xs font-medium"
          x-text="$store.reproductor.reproduciendo ? 'Pausar' : 'Reproducir'"
        ></button>
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
<!-- [IA] fin -->
