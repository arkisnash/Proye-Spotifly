<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotifly — Favoritos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-requires-auth>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">🎵 Spotifly</div>
      <nav>
        <a href="dashboard.html"><span class="icon">🏠</span> Catálogo</a>
        <a href="favoritos.html" class="active"><span class="icon">♡</span> Favoritos</a>
        <a href="historial.html"><span class="icon">🕘</span> Historial</a>
        <a href="admin.html"><span class="icon">⚙</span> Admin</a>
      </nav>
      <a href="playlists.html" class="btn new-playlist-btn">+ Nueva playlist</a>
      <div class="sidebar-section">
        <h4>Tus playlists</h4>
        <div id="sidebarPlaylists"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div></div>
        <div class="user-tag">
          <span id="userTag"></span>
          <button class="secondary" id="logoutBtn">Cerrar sesión</button>
        </div>
      </header>

      <div class="content">
        <h2 class="section-title">Mis favoritos</h2>
        <p>Canciones que marcaste con ♥ desde el catálogo.</p>
        <div id="favoritosWrap"></div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
