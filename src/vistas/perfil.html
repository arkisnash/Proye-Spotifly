<section class="p-6 max-w-xl mx-auto" x-data="{
  usuario: null,

  init() {
    // Leemos el usuario activo desde el store global de sesión
    this.usuario = this.$store.sesion.usuario;
  },

  cerrarSesion() {
    this.$store.sesion.usuario = null;
    window.location.hash = '#/login';
  }
}">
  <h1 class="text-2xl font-bold text-acento">Mi Perfil</h1>
  <p class="text-sm text-texto-2 mt-1">Información de tu cuenta en Spotifly (BST)</p>

  <div class="mt-6 rounded-xl border border-borde bg-superficie p-6 space-y-4">
    <div>
      <p class="text-xs uppercase tracking-wider text-texto-2">Nombre</p>
      <p class="text-lg font-semibold text-texto mt-0.5" x-text="usuario?.nombre || 'Usuario'"></p>
    </div>

    <div>
      <p class="text-xs uppercase tracking-wider text-texto-2">Correo electrónico</p>
      <p class="text-base text-texto mt-0.5" x-text="usuario?.correo || 'No disponible'"></p>
    </div>

    <div>
      <p class="text-xs uppercase tracking-wider text-texto-2">Rol en el sistema</p>
      <p class="text-base text-texto mt-0.5 capitalize" x-text="usuario?.rol || 'Registrado'"></p>
    </div>

    <div class="pt-4 border-t border-borde flex gap-3">
      <a href="#/configuracion" class="rounded-lg bg-superficie border border-borde px-4 py-2 text-sm font-medium text-texto hover:bg-fondo">
        Configuración
      </a>
      <button @click="cerrarSesion()" class="rounded-lg bg-red-500/10 px-4 py-2 text-sm font-medium text-red-400 hover:bg-red-500 hover:text-white transition">
        Cerrar sesión
      </button>
    </div>
  </div>
</section>
