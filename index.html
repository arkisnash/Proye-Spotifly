<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spotifly</title>
</head>
<body>

  <div class="auth-wrap">
    <h1 id="logo">Spotifly</h1>
    <p>Inicia sesión para continuar.</p>

    <form id="loginForm">
      <label for="loginCorreo">Correo</label>
      <input type="email" id="loginCorreo" placeholder="tucorreo@ejemplo.com">

      <label for="loginClave"><br>Contraseña</label>
      <input type="password" id="loginClave" placeholder="••••••••">

      <div class="form-error" id="loginError"></div>
      <button type="submit" class="form-submit">Iniciar sesión</button>
    </form>

    <div class="form-footer">
      ¿No tienes cuenta? <a href="registro.html" class="links">Regístrate aquí</a>
    </div>
  </div>

  <script src="js/comun.js"></script>
</body>
</html>
