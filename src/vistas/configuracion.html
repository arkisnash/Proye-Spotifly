<section x-data="vistaConfiguracion"
         class="animate-aparecer mx-auto max-w-2xl space-y-6 py-8">
  <h1 class="titulo-pagina">Configuración</h1>
  <div class="tarjeta space-y-4 p-6">
    <h2 class="text-xl font-bold">Mis datos</h2>
    <div>
      <label class="etiqueta">Correo electrónico</label>
      <input class="entrada"
             disabled
             :value="$store.sesion.usuario?.correo">
    </div>
    <div>
      <label class="etiqueta">Nombre</label>
      <input class="entrada"
             x-model="nombre"
             maxlength="60">
    </div>
    <div>
      <label class="etiqueta">Biografía</label>
      <textarea class="entrada"
                rows="3"
                maxlength="160"
                x-model="bio"></textarea>
      <p class="text-sm text-tenue">
        <span x-text="bio.length"></span>/160 caracteres
      </p>
    </div>
    <p class="error-campo" x-text="mensaje"></p>
    <button class="btn btn-primario"
            @click="guardar()"
            :disabled="enviando">
      <span x-text="enviando ? 'Guardando...' : 'Guardar cambios'"></span>
    </button>
  </div>
  <div class="tarjeta space-y-4 p-6">
    <h2 class="text-xl font-bold">Apariencia</h2>
    <p class="text-tenue">
      Cambia el aspecto de Spotifly.
    </p>
    <button class="btn btn-secundario"
            @click="$store.tema.alternar()">
      Cambiar a modo
      <span x-text="$store.tema.oscuro ? 'claro' : 'oscuro'"></span>
    </button>
  </div>
  <div class="tarjeta p-6">
    <h2 class="text-xl font-bold mb-3">Sesión</h2>
    <button class="btn btn-peligro"
            @click="$store.sesion.cerrar()">
      Cerrar sesión
    </button>
  </div>
</section>
<!--[IA] fin-->
