<section class="p-6 max-w-md mx-auto" x-data="{
  correo: '',
  clave: '',
  recordar: true,
  error: '',

  async entrar() {
    this.error = '';
    const res = await this.$api.auth.iniciarSesion({ correo: this.correo, clave: this.clave });
    if (res.ok) {
      this.$store.sesion.entrar(res.data); // <-- Usa la función del store que guarda en 'bst:sesion'
      window.location.hash = '#/';
    } else {
      this.error = res.error || 'Error al iniciar sesión';
    }
  }
}">
  <h1 class="text-2xl font-bold text-acento">Iniciar sesión</h1>
  <p class="text-sm text-texto-2 mt-1">(Beat Sound Trackq)</p>

  <p x-show="error" class="mt-4 text-sm text-red-400" x-text="error"></p>

  <form @submit.prevent="entrar()" class="mt-4 space-y-4">
    <div>
      <label class="block text-sm text-texto">Correo</label>
      <input type="email" x-model="correo" required
        class="mt-1 w-full rounded-lg border border-borde bg-superficie px-3 py-2 text-texto" />
    </div>

    <div>
      <label class="block text-sm text-texto">Contraseña</label>
      <input type="password" x-model="clave" required
        class="mt-1 w-full rounded-lg border border-borde bg-superficie px-3 py-2 text-texto" />
    </div>
    
    <div class="flex items-center justify-between text-sm my-3">
      <label class="flex items-center gap-2 cursor-pointer text-texto-2">
        <input type="checkbox" x-model="recordar"
          class="rounded border-borde bg-superficie text-acento focus:ring-0" />
        Recordar sesión
      </label>
    </div>

    <button type="submit" class="w-full rounded-lg bg-boton px-4 py-2 font-medium text-white">
      Entrar
    </button>
  </form>

  <p class="mt-4 text-sm text-texto-2">
    ¿No tienes cuenta? <a href="#/registro" class="text-acento hover:underline">Regístrate</a>
  </p>

</section>
