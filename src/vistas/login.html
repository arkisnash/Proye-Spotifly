<section x-data="vistaLogin" class="animate-aparecer mx-auto max-w-md py-8 lg:py-12">

  <h1 class="titulo-pagina">Iniciar sesión</h1>

  <form class="tarjeta mt-6 space-y-4 p-6"
        novalidate
        @submit.prevent="enviar()"
        @input="revalidar($event)">

    <div>
      <label class="etiqueta">Correo electrónico</label>

      <input name="email"
             type="email"
             class="entrada"
             placeholder="correo@ejemplo.com"
             x-model.trim="form.email"
             @input="validarCampo('email')">

      <p class="error-campo"
         x-show="errores.email"
         x-text="errores.email"></p>
    </div>

    <div>
      <label class="etiqueta">Contraseña</label>

      <input name="password"
             type="password"
             class="entrada"
             placeholder="Tu contraseña"
             x-model="form.password"
             @input="validarCampo('password')">

      <p class="error-campo"
         x-show="errores.password"
         x-text="errores.password"></p>
    </div>

    <p class="alerta-error"
       x-show="errorGeneral"
       x-text="errorGeneral"></p>

    <button type="submit"
            class="btn btn-primario w-full"
            :disabled="enviando">

      <span x-text="enviando ? 'Ingresando...' : 'Ingresar'"></span>

    </button>

    <p class="text-center text-sm text-tenue">
      ¿No tienes cuenta?
      <a href="#/registro" class="text-acento">Regístrate</a>
    </p>

  </form>
</section>
<!--[IA] fin-->
