<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotifly — Crear cuenta</title>
  <link rel="stylesheet" href="/src/css/registro.css">
</head>
<body>
    <div id="panel">
    <h1>Crear cuenta</h1>
    <p>Regístrate para empezar a escuchar.</p>

    <form id="registroForm">
      <label for="regNombre">Nombre</label>
      <input type="text" id="regNombre" placeholder="Tu nombre">

      <label for="regCorreo"><br>Correo</label>
      <input type="email" id="regCorreo" placeholder="tucorreo@ejemplo.com">
      <br>
      <label for="registro telefono">Telefono</label>
      <input type="tel" id="regtel" placeholder="9 1234 5678">

      <label for="regClave"><br>Contraseña</label>
      <input type="password" id="regClave" placeholder="Mínimo 6 caracteres">
      
      <div class="form-error" id="registroError"></div>
      <div class="form-error" id="registroExito" style="color: var(--success);"></div>

      <button type="submit" class="form-submit">Crear cuenta</button>
    </form>
  <div class="form-footer">
      ¿Ya tienes cuenta? <a href="index.html" class="links">Inicia sesión</a>
    </div>  
  </div>

    
  </div>
  
  
</body>
</html>
