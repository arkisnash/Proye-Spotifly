<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de canciones</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-white">

<section class="mx-auto max-w-3xl p-6" x-data="{
  canciones: [], generos: [], busqueda: '', genero: '', cargando: true, error: '',

  async init() {
    const [c, g] = await Promise.all([this.$api.canciones.listar(), this.$api.generos.listar()]);
    if (c.ok && g.ok) { this.canciones = c.data; this.generos = g.data; }
    else { this.error = c.error || g.error; }
    this.cargando = false;
  },

  nombreGenero(id) { return this.generos.find((g) => g.id === id)?.nombre; },

  get resultado() {
    const q = this.busqueda.trim().toLowerCase();
    return this.canciones.filter((c) =>
      (!q || (c.titulo + ' ' + c.artista).toLowerCase().includes(q)) &&
      (!this.genero || c.generoId == this.genero));
  },

  duracion(seg) { return Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0'); },
}">

  <h1 class="text-2xl font-bold text-acento">Explorar</h1>

  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <input type="search" x-model="busqueda" placeholder="Buscar por título o artista"
      class="rounded-lg border border-campo bg-superficie px-4 py-2" />
    <select x-model="genero" class="rounded-lg border border-campo bg-superficie px-4 py-2">
      <option value="">Todos los géneros</option>
      <template x-for="g in generos" :key="g.id">
        <option :value="g.id" x-text="g.nombre"></option>
      </template>
    </select>
  </div>


  <p class="mt-4 text-sm text-gray-400" x-text="resultado.length + ' canciones'"></p>

  <!-- Vacío -->
  <p x-show="resultado.length === 0" class="mt-6 text-gray-400">No hay canciones con esos filtros.</p>

  <!-- Lista -->
  <ul class="mt-4 grid gap-3 sm:grid-cols-2">
  <template x-for="c in resultado" :key="c.id">
    <li class="rounded-xl border border-borde bg-superficie p-4">
      <p class="font-semibold text-acento" x-text="c.titulo"></p>
      <p class="text-sm text-texto-2" x-text="c.artista + ' · ' + nombreGenero(c.generoId)"></p>
    </li>
  </template>
</ul>

</body>
</html>
<!-- [IA] fin -->
