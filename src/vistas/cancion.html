<section class="space-y-4 max-w-xl" x-data="{
    cancion: null,
    cargando: true,
    error: null,
    async init() {
      const id = $store.ruta.parametros.id;
      const res = await $api.canciones.obtener(id);
      if (res.ok) {
        this.cancion = res.data;
      } else {
        this.error = 'No se pudo cargar la canción.';
      }
      this.cargando = false;
    }
}">
  <a href="#/explorar" class="text-xs text-indigo-400 hover:underline">&larr; Volver a explorar</a>

  <div x-show="cargando" class="text-sm opacity-70">Buscando canción...</div>
  <div x-show="error" class="p-3 rounded bg-rose-500/20 text-rose-300 text-sm" x-text="error"></div>

  <div x-show="!cargando && cancion" class="p-6 rounded border border-slate-500/20 space-y-4" style="background: var(--color-superficie)">
    <div>
      <h1 class="text-2xl font-bold" x-text="cancion.titulo"></h1>
      <p class="text-base opacity-80" x-text="cancion.artista"></p>
    </div>

    <div class="grid grid-cols-2 gap-3 text-sm pt-2 border-t border-slate-500/20">
      <div>
        <p class="text-xs opacity-60">Álbum</p>
        <p class="font-medium" x-text="cancion.album || 'Sencillo'"></p>
      </div>
      <div>
        <p class="text-xs opacity-60">Año</p>
        <p class="font-medium" x-text="cancion.anio || '2024'"></p>
      </div>
    </div>

    <div class="pt-3">
      <button @click="$store.reproductor.reproducir(cancion)" class="px-4 py-2 rounded bg-indigo-600 text-white text-sm font-medium">
        Reproducir
      </button>
    </div>
  </div>
</section>
