<section class="p-6 max-w-xl mx-auto" x-data="{
  notificaciones: true,
  calidadAudio: 'alta',
  guardado: false,

  guardar() {
    // Simulamos la persistencia en localStorage
    localStorage.setItem('bst_config', JSON.stringify({
      notificaciones: this.notificaciones,
      calidadAudio: this.calidadAudio
    }));
    this.guardado = true;
    setTimeout(() => this.guardado = false, 2500);
  },

  init() {
    const conf = JSON.parse(localStorage.getItem('bst_config'));
    if (conf) {
      this.notificaciones = conf.notificaciones;
      this.calidadAudio = conf.calidadAudio;
    }
  }
}">
  <h1 class="text-2xl font-bold text-acento">Configuración</h1>
  <p class="text-sm text-texto-2 mt-1">Personaliza tu experiencia en Spotifly (BST)</p>

  <!-- Mensaje de éxito -->
  <div x-show="guardado" class="mt-4 rounded-lg bg-green-500/10 p-3 text-sm text-green-400">
    ¡Configuración guardada correctamente en el navegador!
  </div>

  <div class="mt-6 rounded-xl border border-borde bg-superficie p-6 space-y-5">
    <div class="flex items-center justify-between">
      <div>
        <p class="font-medium text-texto">Notificaciones push</p>
        <p class="text-xs text-texto-2">Recibe alertas de nuevos lanzamientos</p>
      </div>
      <input type="checkbox" x-model="notificaciones" class="h-4 w-4 rounded border-borde bg-fondo text-acento focus:ring-0" />
    </div>

    <div class="border-t border-borde pt-4">
      <label class="block font-medium text-texto text-sm">Calidad de audio</label>
      <p class="text-xs text-texto-2 mb-2">Define la calidad predeterminada de reproducción</p>
      <select x-model="calidadAudio" class="w-full rounded-lg border border-borde bg-fondo px-3 py-2 text-sm text-texto">
        <option value="normal">Normal (128 kbps)</option>
        <option value="alta">Alta (320 kbps)</option>
        <option value="perdida">Sin pérdida / Hi-Fi</option>
      </select>
    </div>

    <div class="pt-4 border-t border-borde">
      <button @click="guardar()" class="rounded-lg bg-boton px-4 py-2 text-sm font-medium text-white">
        Guardar cambios
      </button>
    </div>
  </div>
</section>
